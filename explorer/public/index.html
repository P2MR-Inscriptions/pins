<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#110e0c">
<title>PINS Explorer</title>
<script src="/theme.js"></script>
<link rel="icon" href="/pins-avatar.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div id="banner" hidden></div>
<header class="top">
  <a class="brand" href="#/">
    <img class="logo" src="/pins-avatar.svg" alt="" width="32" height="32">
    <span class="wordmark">PINS Explorer</span>
  </a>
  <button id="nav-toggle" type="button" aria-expanded="false" aria-controls="explorer-nav" aria-label="Open menu">
    <svg class="icon-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
    <svg class="icon-close" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/>
    </svg>
  </button>
  <div class="top-cluster">
  <nav id="explorer-nav" aria-label="Explorer">
    <a href="#/inscriptions">Latest P2MR Inscriptions</a>
    <a href="#/collection" id="nav-collection">Collection</a>
    <a href="#/how-it-works" id="nav-guide">How it works?</a>
    <a href="#/qbit" id="nav-qbit">What is Qbit?</a>
  </nav>
  <form id="search" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="#12 item · 12 P2MR Inscription no. · id · txid · address" aria-label="Search">
    <button type="submit">Search</button>
  </form>
  <button id="theme" type="button" aria-label="Switch to light mode" title="Switch to light mode">
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.75"/>
      <path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M14.6 2.5a8.7 8.7 0 1 0 6.9 12.8A7.3 7.3 0 0 1 14.6 2.5z"/>
    </svg>
  </button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<footer class="site-foot">
  <div class="foot-row">
    <div id="state-line" class="state-line"></div>
    <div id="foot" class="status" aria-live="polite"></div>
    <div class="qbit-group">
      <span class="qbit-note">Built on</span>
      <a class="qbit-block" href="https://qbit.org" target="_blank" rel="noopener noreferrer">
        <img src="/qbit-logo-full.svg" alt="Qbit" width="92" height="40">
      </a>
      <span class="qbit-note">PINS is an independent protocol.</span>
    </div>
  </div>
</footer>
<script type="module" src="/app.js"></script>
</body>
</html>
